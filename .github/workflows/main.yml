name: Android CI

on:
  push:
    branches: [ main, develop ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: gradle/gradle-build-action@v2

      - run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test --no-daemon --stacktrace 2>&1 | tee test.log

      - name: Run Lint
        run: ./gradlew lint --no-daemon --stacktrace 2>&1 | tee lint.log

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: "**/build/outputs/apk/debug/*.apk"

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: "*.log"
